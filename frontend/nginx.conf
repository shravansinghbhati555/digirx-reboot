server {
  listen 80;
  server_name _;

  # SPA fallback — every unknown route falls back to index.html so
  # react-router's BrowserRouter handles client-side routing.
  root /usr/share/nginx/html;
  index index.html;

  # gzip the assets nginx already brotli's-don't-deliver.
  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_min_length 1024;
  gzip_types
    text/plain
    text/css
    text/javascript
    application/javascript
    application/json
    application/xml
    image/svg+xml;

  # ---- security headers ----------------------------------------------------
  # HSTS: 1 year, include subdomains, preload-eligible. Only meaningful
  # over HTTPS — the upstream load balancer / TLS terminator must be set
  # to https for this to actually be honoured.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
  # Block the page from being framed (clickjacking).
  add_header X-Frame-Options "DENY" always;
  # Stop browsers from MIME-sniffing text/plain into something executable.
  add_header X-Content-Type-Options "nosniff" always;
  # Browsers honour the strictest available reference policy.
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Disable powerful APIs we don't use — explicit permissions policy.
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

  # CSP — strict but pragmatic. `unsafe-inline` for styles is needed for
  # the inline-styles the FE uses heavily; tighten once the codebase has
  # nonces. `connect-src` must include the API origin if it's different
  # from the FE origin (set CSP_API_ORIGIN at deploy time, or hardcode).
  add_header Content-Security-Policy
    "default-src 'self'; \
     script-src 'self'; \
     style-src 'self' 'unsafe-inline'; \
     img-src 'self' data: blob: https:; \
     font-src 'self' data:; \
     connect-src 'self' https: wss:; \
     frame-ancestors 'none'; \
     base-uri 'self'; \
     form-action 'self'" always;

  # ---- caching -------------------------------------------------------------
  # Hashed asset filenames → safe to cache for a year.
  location /assets/ {
    expires 1y;
    access_log off;
    add_header Cache-Control "public, immutable" always;
    try_files $uri =404;
  }

  # The shell document is short-lived so a deploy is visible immediately.
  location = /index.html {
    expires 0;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  # nginx-internal — no need to log a hit on every health probe.
  location = /health {
    access_log off;
    return 200 "ok\n";
  }
}

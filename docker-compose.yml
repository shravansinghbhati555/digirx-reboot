services:
  mongodb:
    image: mongo:7
    container_name: digirx_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: rootpassword
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:7-alpine
    container_name: digirx_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  minio:
    image: minio/minio:latest
    container_name: digirx_minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:latest
    container_name: digirx_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      mc alias set digirx http://minio:9000 minioadmin minioadmin &&
      mc mb -p digirx/digirx || true &&
      mc anonymous set none digirx/digirx || true
      "

  # DeepFace embedding sidecar. Internal only — the NestJS backend
  # reaches it as http://face-svc:8000. Port 8000 IS published locally
  # (loopback) so you can smoke-test with curl from the host; remove
  # the `ports` block before production deploy if you don't want any
  # host-level exposure.
  face-svc:
    build: ./face-svc
    container_name: digirx_face_svc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  mongodb_data:
  redis_data:
  minio_data:


name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Re-run nightly so a freshly-disclosed CVE in an existing dep surfaces
  # within 24 hours rather than waiting for the next code change.
  schedule:
    - cron: '13 4 * * *'

env:
  PNPM_VERSION: 10.33.2

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        workspace: [backend, frontend]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: ${{ matrix.workspace }}/pnpm-lock.yaml

      - name: Install
        working-directory: ${{ matrix.workspace }}
        run: pnpm install --frozen-lockfile

      # `--audit-level high` fails only on high/critical CVEs. Moderate
      # findings are surfaced in the run output but don't block merges.
      # Bump to `--audit-level moderate` once the noise level allows it.
      - name: Audit
        working-directory: ${{ matrix.workspace }}
        run: pnpm audit --prod --audit-level high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # The default query suite plus the security-extended pack catches
          # taint flows that the standard pack misses.
          queries: security-extended

      - uses: github/codeql-action/analyze@v3
        with:
          category: '/language:javascript-typescript'
